[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mote = { path = ".." }
hayro = { version = "0.9.0", default-features = false, features = ["embed-cmaps", "embed-fonts"] }
roxmltree = "0.21"
serde = "1.0"
serde_json = "1.0"
sha2 = { version = "0.10.9", default-features = false }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
