[package]
name = "mote"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1.0"
iri-string = "0.7"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
time = { version = "0.3", default-features = false, features = ["std"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout"] }

[dev-dependencies]
roxmltree = "0.21"
